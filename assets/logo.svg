<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .out { stroke:#0F2A2E; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .out2 { stroke:#0F2A2E; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
    </style>
  </defs>

  <!-- shadow -->
  <ellipse cx="120" cy="240" rx="64" ry="11" fill="#0F2A2E" opacity="0.12"/>

  <!-- feet -->
  <path class="out2" d="M98 216 q-14 6 -22 18 q16 8 32 0 z" fill="#E39B27"/>
  <path class="out2" d="M142 216 q14 6 22 18 q-16 8 -32 0 z" fill="#E39B27"/>

  <!-- body -->
  <path class="out" d="M120 42
    C 64 42 40 84 40 132
    C 40 190 74 224 120 224
    C 166 224 200 190 200 132
    C 200 84 176 42 120 42 Z" fill="#E87A2C"/>

  <!-- belly -->
  <path d="M120 104
    C 90 104 78 130 78 158
    C 78 192 98 216 120 216
    C 142 216 162 192 162 158
    C 162 130 150 104 120 104 Z" fill="#FBEFD9"/>

  <!-- head tuft -->
  <path class="out2" d="M108 44 l4 -18 l9 15 z" fill="#E87A2C"/>
  <path class="out2" d="M124 43 l8 -15 l6 16 z" fill="#E87A2C"/>

  <!-- eyes -->
  <ellipse cx="100" cy="104" rx="16" ry="17" fill="#FFFFFF" class="out2"/>
  <ellipse cx="140" cy="104" rx="16" ry="17" fill="#FFFFFF" class="out2"/>
  <circle cx="103" cy="106" r="8" fill="#0F2A2E"/>
  <circle cx="143" cy="106" r="8" fill="#0F2A2E"/>
  <circle cx="100" cy="102" r="3" fill="#FFFFFF"/>
  <circle cx="140" cy="102" r="3" fill="#FFFFFF"/>

  <!-- duck bill -->
  <g class="out2">
    <path d="M86 134 q34 -14 68 0 q4 10 0 18 q-34 14 -68 0 q-4 -8 0 -18 Z" fill="#F5A623"/>
  </g>
  <path d="M90 149 q30 10 60 0" fill="none" stroke="#C85D1B" stroke-width="4" stroke-linecap="round"/>

  <!-- scarf around neck -->
  <path class="out2" d="M74 162 q46 22 92 0 l0 16 q-46 22 -92 0 z" fill="#D64C1E"/>
  <rect x="86" y="164" width="8" height="8" fill="#F26B32"/>
  <rect x="104" y="170" width="8" height="8" fill="#F26B32"/>
  <rect x="122" y="167" width="8" height="8" fill="#F26B32"/>
  <rect x="140" y="171" width="8" height="8" fill="#F26B32"/>
  <!-- scarf tail -->
  <path class="out2" d="M150 176 l24 4 l-2 30 l-22 -6 z" fill="#D64C1E"/>
  <rect x="156" y="184" width="8" height="8" fill="#F26B32"/>
  <rect x="156" y="198" width="8" height="8" fill="#F26B32"/>

  <!-- hands -->
  <ellipse cx="80" cy="198" rx="14" ry="12" fill="#E87A2C" class="out2"/>
  <ellipse cx="160" cy="198" rx="14" ry="12" fill="#E87A2C" class="out2"/>

  <!-- controller -->
  <g>
    <rect x="82" y="188" width="76" height="30" rx="13" fill="#FFFFFF" class="out2"/>
    <rect x="99" y="196" width="4" height="14" fill="#0F2A2E"/>
    <rect x="94" y="200" width="14" height="4" fill="#0F2A2E"/>
    <circle cx="138" cy="198" r="3.4" fill="#D64C1E"/>
    <circle cx="146" cy="205" r="3.4" fill="#1E5F65"/>
    <circle cx="130" cy="205" r="3.4" fill="#F5C518"/>
  </g>
</svg>
